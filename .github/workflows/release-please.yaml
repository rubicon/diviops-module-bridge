name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Credentials come from a shared 1Password item rather than per-repo app
      # secrets, so rotating the key in one place covers every repo. The only
      # repo secret is OP_SERVICE_ACCOUNT_TOKEN, scoped read-only to Automation.
      - name: Load release-please app credentials
        id: op
        uses: 1password/load-secrets-action@dafbe7cb03502b260e2b2893c753c352eee545bf # v3
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: "op://Automation/rubicon-release-please-private-key/app id"
          PRIVATE_KEY: "op://Automation/rubicon-release-please-private-key/private key"

      # The App token gives release-please a signing identity, so its commits
      # are verified and satisfy require-signed-commits on main.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ steps.op.outputs.APP_ID }}
          private-key: ${{ steps.op.outputs.PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
